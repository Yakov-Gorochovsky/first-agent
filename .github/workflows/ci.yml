name: Neural Swarm CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check core tools.py server.py agent.py evals.py

      - name: Run Mypy Type Checker
        run: |
          mypy core tools.py server.py agent.py evals.py

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=core --cov=tools --cov=server --cov-report=xml --cov-report=term

      - name: Run Deterministic Evals Scorecard
        run: |
          python evals.py
