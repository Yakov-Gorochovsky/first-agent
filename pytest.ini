[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Fast isolated unit tests with zero I/O or mocks
    integration: Multi-component integration tests (storage, bus, swarms)
    security: Threat mitigation, AST sandbox, SSRF, auth isolation tests
    e2e: End-to-end regression evaluations
filterwarnings =
    ignore::DeprecationWarning
