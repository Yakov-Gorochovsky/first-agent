<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEURAL SWARM — Tactical Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-base: #07080c;
      --bg-surface: #0c0e14;
      --bg-elevated: #12151e;
      --bg-glass: rgba(14, 17, 24, 0.82);
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.14);
      --accent-cyan: #38bdf8;
      --accent-emerald: #10b981;
      --accent-violet: #a855f7;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: grid;
      grid-template-rows: 48px 1fr 58px;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Command Bar (Tight 48px Linear/Palantir header) */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 10px var(--accent-emerald);
      position: relative;
    }

    .status-dot::after {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid var(--accent-emerald);
      animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    @keyframes ping {
      75%, 100% { transform: scale(2); opacity: 0; }
    }

    .brand-name {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-mono {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group {
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px 8px;
      gap: 6px;
    }

    .control-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .select-clean {
      background: transparent;
      color: var(--text-primary);
      border: none;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 2px;
      outline: none;
      cursor: pointer;
    }

    .select-clean option {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 11px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 500;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn svg {
      width: 13px;
      height: 13px;
    }

    .btn-cyan {
      color: var(--accent-cyan);
      border-color: rgba(56, 189, 248, 0.25);
      background: rgba(56, 189, 248, 0.08);
    }
    .btn-cyan:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.45);
    }

    .btn-emerald {
      color: var(--accent-emerald);
      border-color: rgba(16, 185, 129, 0.28);
      background: rgba(16, 185, 129, 0.08);
    }
    .btn-emerald:hover {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.5);
    }

    .btn-rose {
      color: #fb7185;
      border-color: rgba(244, 63, 94, 0.35);
      background: rgba(244, 63, 94, 0.1);
    }
    .btn-rose:hover {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.6);
    }

    /* Main Workspace Grid (Tight 8px gaps, sleek hairline cards) */
    main {
      display: grid;
      grid-template-columns: 300px 1fr 360px;
      gap: 8px;
      padding: 8px;
      overflow: hidden;
      background: var(--bg-base);
    }

    .col-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex: 1;
    }

    .card-header {
      height: 34px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.015);
      flex-shrink: 0;
    }

    .card-header-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-header-title svg {
      width: 13px;
      height: 13px;
      color: var(--text-muted);
    }

    .card-body {
      padding: 8px;
      overflow-y: auto;
      flex: 1;
    }

    /* Specialist Roster Items */
    .role-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px;
      border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      margin-bottom: 6px;
      transition: border-color 0.15s ease;
    }

    .role-row:hover {
      border-color: var(--border-strong);
    }

    .role-info {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .role-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .role-name {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .role-sub {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tag-list {
      display: flex;
      gap: 4px;
      margin-top: 3px;
    }

    .mini-tag {
      font-family: var(--font-mono);
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }
    .icon-btn:hover {
      color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.1);
    }

    /* Memory & Skill Items */
    .vault-item {
      padding: 7px 9px;
      border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      margin-bottom: 6px;
      font-size: 11.5px;
    }

    .vault-key {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--accent-cyan);
      margin-bottom: 2px;
    }

    .skill-item {
      padding: 8px 10px;
      border-radius: 6px;
      background: rgba(168, 85, 247, 0.05);
      border: 1px solid rgba(168, 85, 247, 0.18);
      margin-bottom: 6px;
      font-size: 11px;
    }

    .skill-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .skill-badge {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: #d8b4fe;
      background: rgba(168, 85, 247, 0.18);
      padding: 1px 6px;
      border-radius: 3px;
    }

    /* Center Stage: Interactive Graph Canvas */
    .stage-card {
      position: relative;
      background: radial-gradient(circle at 50% 50%, #101420 0%, #080a0f 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #networkCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud-Floating-Bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .hud-chip {
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      padding: 5px 10px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* Answer Drawer Overlay */
    .synthesis-drawer {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      max-height: 42%;
      background: rgba(12, 15, 23, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-y: auto;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .synthesis-drawer.visible {
      display: block;
    }

    .synthesis-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      color: var(--accent-emerald);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .synthesis-body {
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-primary);
      white-space: pre-wrap;
    }

    /* Right Column: Telemetry & Budgets */
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .stat-tile {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 2px;
    }

    .mini-bar {
      height: 3px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      margin-top: 6px;
      overflow: hidden;
    }

    .mini-bar-fill {
      height: 100%;
      background: var(--accent-cyan);
      width: 0%;
      transition: width 0.25s ease;
    }

    /* Telemetry Stream */
    .trace-item {
      padding: 7px 9px;
      border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-left: 2px solid var(--text-muted);
      margin-bottom: 6px;
      font-size: 11px;
      line-height: 1.45;
      word-break: break-word;
    }

    .trace-item.peer_message, .trace-item.delegation {
      border-left-color: var(--accent-cyan);
    }
    .trace-item.tool_call {
      border-left-color: var(--accent-amber);
    }
    .trace-item.tool_result {
      border-left-color: var(--accent-emerald);
    }
    .trace-item.skill_learned {
      border-left-color: var(--accent-violet);
    }
    .trace-item.arena_attack {
      border-left-color: var(--accent-rose);
      background: rgba(244, 63, 94, 0.07);
    }
    .trace-item.arena_defense {
      border-left-color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.07);
    }

    .trace-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .trace-meta strong {
      color: var(--text-secondary);
    }

    .trace-content {
      font-family: var(--font-mono);
      color: var(--text-primary);
      font-size: 11px;
    }

    /* Bottom Command Deck */
    footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
    }

    .command-box {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0 12px;
      height: 38px;
      transition: border-color 0.15s ease;
    }

    .command-box:focus-within {
      border-color: var(--accent-cyan);
    }

    .command-box svg {
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      margin-right: 10px;
    }

    .prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      outline: none;
    }

    .prompt-input::placeholder {
      color: var(--text-muted);
    }

    .btn-primary {
      height: 38px;
      padding: 0 16px;
      background: var(--text-primary);
      color: var(--bg-base);
      font-weight: 600;
      font-size: 12px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: opacity 0.15s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-primary svg {
      width: 14px;
      height: 14px;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(4, 6, 10, 0.75);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      width: 420px;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .field {
      margin-bottom: 11px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .field-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 7px 10px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      outline: none;
    }

    .field-input:focus {
      border-color: var(--accent-cyan);
    }

    .checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .check-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- TOP HEADER -->
  <header>
    <div class="brand">
      <div class="status-dot"></div>
      <div class="brand-name">
        NEURAL SWARM
        <span class="badge-mono" id="modelBadge">Connecting...</span>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn btn-cyan" onclick="openRoleModal()">
        <i data-lucide="user-plus"></i> New Role
      </button>

      <div class="control-group">
        <span class="control-label">Tenant</span>
        <select id="tenantSelect" class="select-clean">
          <option value="victim_vault">victim_vault (Target Swarm)</option>
          <option value="red_team">red_team (Attacker Swarm)</option>
          <option value="client_a">client_a (Fintech)</option>
          <option value="client_b">client_b (Healthcare)</option>
        </select>
      </div>

      <div class="control-group">
        <span class="control-label">Topology</span>
        <select id="modeSelect" class="select-clean" onchange="handleModeChange()">
          <option value="peer">Peer Network (Inboxes)</option>
          <option value="orchestrator">Orchestrator -> Workers</option>
          <option value="arena">Red vs Blue Arena (2 Swarms)</option>
        </select>
      </div>

      <button class="btn btn-rose" onclick="launchArena()">
        <i data-lucide="swords"></i> Red vs Blue Live
      </button>

      <button class="btn btn-emerald" onclick="triggerSimulation()">
        <i data-lucide="zap"></i> Simulate Flow
      </button>

      <button class="btn" onclick="runEvals()">
        <i data-lucide="check-circle-2"></i> Run Evals
      </button>

      <button class="btn" onclick="testPrivacyAirlock()">
        <i data-lucide="shield-check"></i> Test Airlock
      </button>
    </div>
  </header>

  <!-- MAIN WORKSPACE -->
  <main>
    <!-- LEFT COLUMN -->
    <div class="col-stack">
      <div class="card" style="flex: 1.15;">
        <div class="card-header">
          <span class="card-header-title"><i data-lucide="cpu"></i> Specialist Roster</span>
          <span class="badge-mono" id="roleCountBadge">0</span>
        </div>
        <div class="card-body" id="rolesList"></div>
      </div>

      <div class="card" style="flex: 0.85;">
        <div class="card-header">
          <span class="card-header-title"><i data-lucide="lock"></i> Tenant Vault</span>
          <span class="badge-mono" id="tenantTag" style="color: var(--accent-cyan);">client_a</span>
        </div>
        <div class="card-body" id="memoryList"></div>
      </div>

      <div class="card" style="flex: 1;">
        <div class="card-header">
          <span class="card-header-title"><i data-lucide="globe"></i> Global Playbooks</span>
          <span class="badge-mono" style="color: #d8b4fe;">AIRLOCKED</span>
        </div>
        <div class="card-body" id="skillsList"></div>
      </div>
    </div>

    <!-- CENTER STAGE: GRAPH CANVAS -->
    <div class="stage-card">
      <div class="hud-Floating-Bar">
        <div class="hud-chip">
          <span style="width:6px;height:6px;border-radius:50%;background:var(--accent-cyan);"></span>
          <span id="swarmStatusPill">STANDBY · SSE STREAM ACTIVE</span>
        </div>
        <div class="hud-chip" id="activeNodePill">NODE: IDLE</div>
      </div>

      <canvas id="networkCanvas"></canvas>

      <div class="synthesis-drawer" id="answerDrawer">
        <div class="synthesis-header">
          <span>✓ Swarm Synthesis Output</span>
          <span style="cursor:pointer; color:var(--text-muted);" onclick="document.getElementById('answerDrawer').classList.remove('visible')">ESC / CLOSE ✕</span>
        </div>
        <div class="synthesis-body" id="answerText"></div>
      </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="col-stack">
      <div class="card" style="flex: 0 0 auto;">
        <div class="card-header">
          <span class="card-header-title"><i data-lucide="gauge"></i> Resource Guardrails</span>
          <span class="badge-mono" id="elapsedLabel">0.0s</span>
        </div>
        <div class="card-body">
          <div class="metrics-row">
            <div class="stat-tile">
              <div class="stat-label">Steps</div>
              <div class="stat-value" id="stepMetric">0/16</div>
              <div class="mini-bar"><div class="mini-bar-fill" id="stepBar"></div></div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">Tokens</div>
              <div class="stat-value" id="tokenMetric">0</div>
              <div class="mini-bar"><div class="mini-bar-fill" id="tokenBar"></div></div>
            </div>
            <div class="stat-tile">
              <div class="stat-label">Packets</div>
              <div class="stat-value" id="packetMetric">0</div>
              <div class="mini-bar"><div class="mini-bar-fill" style="width:100%; background:var(--accent-emerald);"></div></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="flex: 1;">
        <div class="card-header">
          <span class="card-header-title"><i data-lucide="terminal"></i> Telemetry Stream</span>
          <button class="icon-btn" onclick="document.getElementById('telemetryFeed').innerHTML=''" title="Clear stream">
            <i data-lucide="trash-2" style="width:12px;height:12px;"></i>
          </button>
        </div>
        <div class="card-body" id="telemetryFeed"></div>
      </div>
    </div>
  </main>

  <!-- FOOTER COMMAND INPUT -->
  <footer>
    <div class="command-box">
      <i data-lucide="sparkles"></i>
      <input
        id="promptInput"
        class="prompt-input"
        type="text"
        placeholder="Dispatch mission to the swarm (e.g. 'Audit snippet with security_reviewer' or 'Compute 15th prime with coder')..."
      />
    </div>
    <button class="btn-primary" onclick="launchMission(false)">
      <i data-lucide="play"></i> Dispatch
    </button>
  </footer>

  <!-- NEW ROLE MODAL -->
  <div class="modal-backdrop" id="roleModal">
    <div class="modal-dialog">
      <div class="modal-title">
        <span>Create Specialist Role</span>
        <button class="icon-btn" onclick="closeRoleModal()"><i data-lucide="x"></i></button>
      </div>
      <div class="field">
        <label>Role Identifier (snake_case)</label>
        <input id="roleNameInput" class="field-input" placeholder="e.g. data_analyst" />
      </div>
      <div class="field">
        <label>Role Title</label>
        <input id="roleTitleInput" class="field-input" placeholder="e.g. Quantitative Data Analyst" />
      </div>
      <div class="field">
        <label>Capability Bundles</label>
        <div class="checkbox-grid">
          <label class="check-pill"><input type="checkbox" class="cap-check" value="@web" checked /> @web</label>
          <label class="check-pill"><input type="checkbox" class="cap-check" value="@code" checked /> @code</label>
          <label class="check-pill"><input type="checkbox" class="cap-check" value="@files" /> @files</label>
          <label class="check-pill"><input type="checkbox" class="cap-check" value="@memory" /> @memory</label>
        </div>
      </div>
      <div class="field">
        <label>Node Accent Color</label>
        <input id="roleColorInput" class="field-input" value="#38bdf8" />
      </div>
      <div class="field">
        <label>System Prompt Instructions</label>
        <textarea id="roleInstInput" class="field-input" rows="3" placeholder="Define how this specialist operates and verifies its work..."></textarea>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
        <button class="btn" onclick="closeRoleModal()">Cancel</button>
        <button class="btn btn-cyan" onclick="submitNewRole()">Create Role</button>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');

    let packetCount = 0;
    let activeNode = null;
    let activeToolBadge = {};
    let inboxCounts = {};
    let nodes = {};
    let edges = [];
    let arenaMode = false;
    let cachedRoles = [];
    const particles = [];

    function rebuildArenaGraph() {
      arenaMode = true;
      nodes = {
        // Left Cluster: Red Team Attacker Swarm
        red_lead:       { label: 'RED LEAD',       role: 'Attacker Coordinator', rx: 0.13, ry: 0.50, color: '#f43f5e' },
        injector:       { label: 'INJECTOR',       role: 'Prompt & Vault Prober', rx: 0.31, ry: 0.27, color: '#fb923c' },
        sandbox_prober: { label: 'SANDBOX PROBE',  role: 'SSRF & Path Prober',    rx: 0.31, ry: 0.73, color: '#f43f5e' },

        // Right Cluster: Hardened Victim Swarm
        victim_hub:     { label: 'VICTIM HUB',     role: 'Target Ingress & Vault', rx: 0.65, ry: 0.50, color: '#38bdf8' },
        victim_web:     { label: 'VICTIM WEB',     role: 'SSRF-Guarded Fetcher',   rx: 0.85, ry: 0.24, color: '#10b981' },
        victim_coder:   { label: 'VICTIM CODER',   role: 'Scrubbed Py Sandbox',    rx: 0.85, ry: 0.50, color: '#10b981' },
        airlock_guard:  { label: 'DLP AIRLOCK',    role: 'Canary & PII Shield',    rx: 0.85, ry: 0.76, color: '#a855f7' },
      };
      edges = [
        ['red_lead', 'injector'],
        ['red_lead', 'sandbox_prober'],
        ['injector', 'victim_hub'],
        ['sandbox_prober', 'victim_hub'],
        ['victim_hub', 'victim_web'],
        ['victim_hub', 'victim_coder'],
        ['victim_hub', 'airlock_guard'],
        ['victim_coder', 'airlock_guard'],
      ];
    }

    function rebuildGraphFromRoles(roleList) {
      cachedRoles = roleList || cachedRoles;
      if (document.getElementById('modeSelect').value === 'arena' || arenaMode) {
        rebuildArenaGraph();
        return;
      }
      nodes = {
        user:        { label: 'USER',        role: 'Client Ingress',     rx: 0.13, ry: 0.50, color: '#94a3b8' },
        coordinator: { label: 'COORDINATOR', role: 'Router & Hub',       rx: 0.39, ry: 0.50, color: '#38bdf8' },
        airlock:     { label: 'AIRLOCK DB',  role: 'SQLite · Scrubbing', rx: 0.39, ry: 0.85, color: '#a855f7' },
      };
      edges = [
        ['user', 'coordinator'],
        ['coordinator', 'airlock'],
      ];

      const count = roleList.length;
      roleList.forEach((r, idx) => {
        const t = count === 1 ? 0 : (idx / (count - 1)) * 2 - 1;
        const angle = t * (Math.PI * 0.37);
        const rx = 0.39 + Math.cos(angle) * 0.42;
        const ry = 0.50 + Math.sin(angle) * 0.36;

        nodes[r.name] = {
          label: r.name.toUpperCase(),
          role: r.title,
          rx,
          ry,
          color: r.color || '#10b981',
        };
        edges.push(['coordinator', r.name]);
        if (idx > 0) {
          edges.push([roleList[idx - 1].name, r.name]);
        }
      });
    }

    function handleModeChange() {
      const m = document.getElementById('modeSelect').value;
      arenaMode = (m === 'arena');
      if (arenaMode) {
        rebuildArenaGraph();
      } else {
        rebuildGraphFromRoles(cachedRoles);
      }
    }

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnPacket(fromKey, toKey, color = '#38bdf8', label = '') {
      if (fromKey === 'orchestrator') fromKey = 'coordinator';
      if (toKey === 'orchestrator') toKey = 'coordinator';
      if (!nodes[fromKey] || !nodes[toKey]) return;

      packetCount++;
      document.getElementById('packetMetric').textContent = packetCount;

      for (let i = 0; i < 5; i++) {
        particles.push({
          from: fromKey,
          to: toKey,
          progress: -i * 0.045,
          speed: 0.017,
          color,
          size: i === 0 ? 4.5 : 3 - i * 0.4,
          alpha: 1 - i * 0.16,
          label: i === 0 ? label : '',
        });
      }
    }

    // Subtle curved control point for Bezier edges
    function getPointOnCurve(ax, ay, bx, by, t) {
      const mx = (ax + bx) / 2;
      const my = (ay + by) / 2 - (bx - ax) * 0.06;
      const x = (1 - t) * (1 - t) * ax + 2 * (1 - t) * t * mx + t * t * bx;
      const y = (1 - t) * (1 - t) * ay + 2 * (1 - t) * t * my + t * t * by;
      return { x, y, mx, my };
    }

    let spinAngle = 0;
    function renderNetwork() {
      const W = canvas.parentElement.clientWidth;
      const H = canvas.parentElement.clientHeight;
      ctx.clearRect(0, 0, W, H);
      spinAngle += 0.025;

      // Subtle dot matrix grid on canvas
      ctx.fillStyle = 'rgba(255, 255, 255, 0.045)';
      const step = 28;
      for (let gx = step; gx < W; gx += step) {
        for (let gy = step; gy < H; gy += step) {
          ctx.fillRect(gx, gy, 1, 1);
        }
      }

      // If in Red vs Blue Arena Mode, draw the tactical zone divider & banners
      if (arenaMode) {
        const midX = W * 0.48;
        ctx.save();
        ctx.setLineDash([5, 6]);
        ctx.beginPath();
        ctx.moveTo(midX, 46);
        ctx.lineTo(midX, H - 20);
        ctx.strokeStyle = 'rgba(244, 63, 94, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.font = '600 10px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fb7185';
        ctx.fillText('⚔️ ATTACKER SWARM (RED_TEAM)', W * 0.23, 62);
        ctx.fillStyle = '#38bdf8';
        ctx.fillText('🛡️ VICTIM SWARM (VICTIM_VAULT)', W * 0.75, 62);
        ctx.restore();
      }

      // Draw smooth curved edges
      for (const [a, b] of edges) {
        const na = nodes[a];
        const nb = nodes[b];
        if (!na || !nb) continue;
        const ax = na.rx * W, ay = na.ry * H;
        const bx = nb.rx * W, by = nb.ry * H;
        const { mx, my } = getPointOnCurve(ax, ay, bx, by, 0.5);

        ctx.beginPath();
        ctx.moveTo(ax, ay);
        ctx.quadraticCurveTo(mx, my, bx, by);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.075)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      // Draw animated comet packets along curves
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.progress += p.speed;
        if (p.progress > 1) {
          particles.splice(i, 1);
          continue;
        }
        if (p.progress < 0) continue;

        const na = nodes[p.from];
        const nb = nodes[p.to];
        if (!na || !nb) continue;
        const pt = getPointOnCurve(na.rx * W, na.ry * H, nb.rx * W, nb.ry * H, p.progress);

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();
        ctx.restore();

        if (p.label) {
          ctx.font = '500 9.5px "JetBrains Mono", monospace';
          ctx.fillStyle = '#e2e8f0';
          ctx.fillText(p.label, pt.x + 8, pt.y - 7);
        }
      }

      // Draw nodes
      for (const [key, node] of Object.entries(nodes)) {
        const x = node.rx * W;
        const y = node.ry * H;
        const isActive = (activeNode === key) || (activeNode === 'orchestrator' && key === 'coordinator');

        // Active precision ring
        if (isActive) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(spinAngle);
          ctx.beginPath();
          ctx.arc(0, 0, 34, 0, Math.PI * 1.4);
          ctx.strokeStyle = node.color;
          ctx.lineWidth = 1.8;
          ctx.stroke();
          ctx.restore();
        }

        // Node body
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, Math.PI * 2);
        ctx.fillStyle = isActive ? '#161f30' : '#0d1017';
        ctx.strokeStyle = isActive ? node.color : 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = isActive ? 2 : 1.2;
        ctx.shadowBlur = isActive ? 20 : 0;
        ctx.shadowColor = node.color;
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Inner accent dot
        ctx.beginPath();
        ctx.arc(x, y - 7, 3, 0, Math.PI * 2);
        ctx.fillStyle = node.color;
        ctx.fill();

        // Node label
        ctx.textAlign = 'center';
        ctx.font = '600 9.5px "JetBrains Mono", monospace';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(node.label.slice(0, 12), x, y + 6);

        // Role subtitle pill below node
        ctx.font = '500 10.5px "Inter", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(node.role, x, y + 38);

        // Inbox badge
        const qCount = inboxCounts[key] || 0;
        if (qCount > 0) {
          ctx.beginPath();
          ctx.arc(x + 19, y - 19, 8.5, 0, Math.PI * 2);
          ctx.fillStyle = '#f43f5e';
          ctx.fill();
          ctx.font = '600 9.5px "JetBrains Mono", monospace';
          ctx.fillStyle = '#fff';
          ctx.fillText(String(qCount), x + 19, y - 15.5);
        }

        // Active tool pill
        if (activeToolBadge[key]) {
          ctx.font = '500 9.5px "JetBrains Mono", monospace';
          ctx.fillStyle = '#f59e0b';
          ctx.fillText(`⚡ ${activeToolBadge[key]}`, x, y - 32);
        }
      }

      requestAnimationFrame(renderNetwork);
    }
    requestAnimationFrame(renderNetwork);

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeColor(color) {
      return /^#[0-9a-fA-F]{3,8}$/.test(String(color || '').trim()) ? String(color).trim() : '#10b981';
    }

    function appendLog(type, title, body) {
      const feed = document.getElementById('telemetryFeed');
      const div = document.createElement('div');
      div.className = `trace-item ${escapeHtml(type)}`;
      const now = new Date().toLocaleTimeString([], { hour12: false });
      div.innerHTML = `
        <div class="trace-meta"><strong>${escapeHtml(title)}</strong><span>${escapeHtml(now)}</span></div>
        <div class="trace-content">${escapeHtml(body)}</div>
      `;
      feed.prepend(div);
    }

    async function refreshState() {
      const tenant = document.getElementById('tenantSelect').value;
      document.getElementById('tenantTag').textContent = tenant;
      const res = await fetch(`/api/state?tenant=${encodeURIComponent(tenant)}`);
      const data = await res.json();

      const roles = data.roles || [];
      document.getElementById('modelBadge').textContent = `${data.model}`;
      document.getElementById('roleCountBadge').textContent = `${roles.length}`;

      rebuildGraphFromRoles(roles);

      // Render specialist roster
      const rolesBox = document.getElementById('rolesList');
      rolesBox.innerHTML = roles
        .map(r => {
          const col = safeColor(r.color);
          const safeName = escapeHtml(r.name);
          return `
          <div class="role-row">
            <div class="role-info">
              <span class="role-dot" style="background:${col}; box-shadow: 0 0 8px ${col};"></span>
              <div style="min-width:0;">
                <div class="role-name">${safeName}</div>
                <div class="role-sub">${escapeHtml(r.title)}</div>
                <div class="tag-list">
                  ${(r.capabilities || []).map(c => `<span class="mini-tag">${escapeHtml(c)}</span>`).join('')}
                </div>
              </div>
            </div>
            <button class="icon-btn" title="Remove role" onclick="deleteRole('${safeName}')">✕</button>
          </div>
        `;
        })
        .join('');

      // Render tenant memories
      const memBox = document.getElementById('memoryList');
      const memEntries = Object.entries(data.tenant_memories || {});
      if (memEntries.length === 0) {
        memBox.innerHTML = `<div style="color:var(--text-muted); font-size:11px; padding:4px;">Vault empty for <b>${escapeHtml(tenant)}</b>.</div>`;
      } else {
        memBox.innerHTML = memEntries
          .map(([k, v]) => `<div class="vault-item"><div class="vault-key">${escapeHtml(k)}</div><div>${escapeHtml(v)}</div></div>`)
          .join('');
      }

      // Render global skills
      const skillBox = document.getElementById('skillsList');
      const skills = data.global_skills || [];
      if (skills.length === 0) {
        skillBox.innerHTML = `<div style="color:var(--text-muted); font-size:11px; padding:4px;">No global playbooks distilled yet.</div>`;
      } else {
        skillBox.innerHTML = skills
          .map(s => `
            <div class="skill-item">
              <div class="skill-head">
                <span class="skill-badge">${escapeHtml(s.category)}</span>
                <span style="font-family:var(--font-mono); font-size:9.5px; color:var(--text-muted);">x${escapeHtml(s.learned_count)}</span>
              </div>
              <div style="color:var(--text-secondary); margin-bottom:3px;">${escapeHtml(s.problem_pattern)}</div>
              <div style="color:var(--accent-emerald); font-weight:500;">→ ${escapeHtml(s.solution_rule)}</div>
            </div>
          `)
          .join('');
      }
    }

    function openRoleModal() {
      document.getElementById('roleModal').classList.add('open');
    }
    function closeRoleModal() {
      document.getElementById('roleModal').classList.remove('open');
    }

    async function submitNewRole() {
      const name = document.getElementById('roleNameInput').value.trim();
      const title = document.getElementById('roleTitleInput').value.trim();
      const color = document.getElementById('roleColorInput').value.trim() || '#38bdf8';
      const instructions = document.getElementById('roleInstInput').value.trim();
      const capabilities = Array.from(document.querySelectorAll('.cap-check:checked')).map(c => c.value);

      if (!name || !title) {
        alert('Enter both Role Identifier and Role Title.');
        return;
      }

      await fetch('/api/roles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, title, instructions, capabilities, color }),
      });
      closeRoleModal();
      await refreshState();
    }

    async function deleteRole(name) {
      await fetch('/api/roles/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      await refreshState();
    }

    document.getElementById('tenantSelect').addEventListener('change', () => {
      refreshState();
      appendLog('peer_message', 'TENANT VAULT SWITCHED', `Active partition: ${document.getElementById('tenantSelect').value}`);
    });

    const evtSource = new EventSource('/api/events');
    evtSource.onmessage = (e) => {
      const ev = JSON.parse(e.data);
      const etype = ev.event_type;
      const agent = ev.agent_name === 'orchestrator' ? 'coordinator' : ev.agent_name;
      const d = ev.data || {};

      if (d.inboxes) inboxCounts = d.inboxes;

      if (etype === 'role_created') {
        refreshState();
        const r = d.role || {};
        appendLog('skill_learned', `ROLE SPAWNED · ${r.name}`, `${r.title} [${(r.resolved_tools || []).join(', ')}]`);
      } else if (etype === 'role_deleted') {
        refreshState();
      } else if (etype === 'arena_start') {
        arenaMode = true;
        document.getElementById('modeSelect').value = 'arena';
        document.getElementById('tenantSelect').value = 'victim_vault';
        rebuildArenaGraph();
        refreshState();
        document.getElementById('swarmStatusPill').textContent = '⚔️ RED TEAM vs VICTIM SWARM · LIVE OLLAMA DUEL';
        document.getElementById('answerDrawer').classList.remove('visible');
        appendLog('arena_attack', '⚔️ ARENA INITIALIZED', d.objective);
      } else if (etype === 'arena_attack') {
        activeNode = 'victim_hub';
        spawnPacket(d.from_agent, d.to_agent, '#f43f5e', `⚔️ R${d.round}: ${d.vector.toUpperCase()}`);
        appendLog('arena_attack', `⚔️ [ROUND ${d.round} ATTACK] ${d.from_agent.toUpperCase()} → VICTIM_HUB`, d.attack_prompt);
      } else if (etype === 'arena_defense') {
        spawnPacket(d.from_agent, 'airlock_guard', '#10b981', `🛡️ ${d.verdict}`);
        appendLog('arena_defense', `🛡️ [ROUND ${d.round} ${d.verdict}] (${d.from_agent.toUpperCase()})`, d.victim_reply);
        refreshState();
      } else if (etype === 'mission_start') {
        if (d.mode === 'arena') {
          arenaMode = true;
          rebuildArenaGraph();
        }
        document.getElementById('swarmStatusPill').textContent = `ACTIVE · ${d.mode.toUpperCase()} TOPOLOGY`;
        document.getElementById('answerDrawer').classList.remove('visible');
        appendLog('peer_message', `DISPATCH [${ev.tenant_id}]`, d.prompt);
      } else if (etype === 'agent_start') {
        activeNode = agent;
        document.getElementById('activeNodePill').textContent = `NODE: ${agent.toUpperCase()}`;
      } else if (etype === 'peer_message') {
        const pktColor = (d.from_agent === 'red_lead' || d.from_agent === 'injector' || d.from_agent === 'sandbox_prober') ? '#fb923c' : '#38bdf8';
        spawnPacket(d.from_agent, d.to_agent, pktColor, 'MSG');
        appendLog('peer_message', `${d.from_agent.toUpperCase()} → ${d.to_agent.toUpperCase()}`, d.message);
      } else if (etype === 'delegation') {
        spawnPacket('coordinator', d.to_worker, '#10b981', 'TASK');
        appendLog('delegation', `COORDINATOR → ${d.to_worker.toUpperCase()}`, d.task);
      } else if (etype === 'tool_call') {
        activeNode = agent;
        activeToolBadge[agent] = d.tool;
        appendLog('tool_call', `${agent.toUpperCase()} · ${d.tool}`, JSON.stringify(d.arguments));
      } else if (etype === 'tool_result') {
        delete activeToolBadge[agent];
        appendLog('tool_result', `${agent.toUpperCase()} · OUTPUT`, String(d.result || '').slice(0, 220));
        refreshState();
      } else if (etype === 'skill_learned') {
        spawnPacket(agent in nodes ? agent : 'coordinator', 'airlock', '#a855f7', 'AIRLOCK');
        appendLog('skill_learned', `AIRLOCK · ${d.category}`, `${d.problem_pattern} → ${d.solution_rule}`);
        refreshState();
      } else if (etype === 'budget') {
        document.getElementById('stepMetric').textContent = `${d.total_steps}/${d.max_swarm_steps}`;
        document.getElementById('tokenMetric').textContent = d.total_tokens;
        document.getElementById('elapsedLabel').textContent = `${d.elapsed_seconds}s`;
        document.getElementById('stepBar').style.width = `${Math.min(100, (d.total_steps / d.max_swarm_steps) * 100)}%`;
        document.getElementById('tokenBar').style.width = `${Math.min(100, (d.total_tokens / d.max_total_tokens) * 100)}%`;
      } else if (etype === 'swarm_complete' || etype === 'mission_end') {
        activeNode = null;
        inboxCounts = {};
        document.getElementById('activeNodePill').textContent = 'NODE: IDLE';
        document.getElementById('swarmStatusPill').textContent = 'STANDBY · MISSION COMPLETE';
        if (d.answer || d.reply) {
          const text = d.answer || d.reply;
          if (text !== 'Simulation complete.') {
            document.getElementById('answerText').textContent = text;
            document.getElementById('answerDrawer').classList.add('visible');
          }
        }
        refreshState();
      }
    };

    async function launchMission(simulate = false) {
      const input = document.getElementById('promptInput');
      const prompt = input.value.trim() || "Analyze live system throughput, run Python efficiency benchmark, verify accuracy, and store findings.";
      const tenant_id = document.getElementById('tenantSelect').value;
      const mode = document.getElementById('modeSelect').value;

      await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, tenant_id, mode, simulate }),
      });
    }

    async function launchArena() {
      arenaMode = true;
      document.getElementById('modeSelect').value = 'arena';
      document.getElementById('tenantSelect').value = 'victim_vault';
      rebuildArenaGraph();
      const input = document.getElementById('promptInput');
      const prompt = input.value.trim() || "Execute 3-round live Red Team vs. Victim Swarm offensive/defensive evaluation (Vault Canary Injection, SSRF Internal Probe, and .env/Subprocess Sandbox Escape).";
      await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt, tenant_id: 'red_team', mode: 'arena', simulate: false }),
      });
    }

    function triggerSimulation() {
      arenaMode = false;
      if (document.getElementById('modeSelect').value === 'arena') {
        document.getElementById('modeSelect').value = 'peer';
      }
      rebuildGraphFromRoles(cachedRoles);
      const promptInput = document.getElementById('promptInput');
      if (!promptInput.value.trim()) {
        promptInput.value = "Fetch live telemetry benchmarks, compute Python efficiency score, and verify accuracy.";
      }
      launchMission(true);
    }

    async function testPrivacyAirlock() {
      const tenant_id = document.getElementById('tenantSelect').value;
      await fetch('/api/airlock-test', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tenant_id,
          category: 'python_api',
          problem: `Client ${tenant_id} user admin@${tenant_id}.com with key sk-987654321abcd failed scraping https://private.${tenant_id}.org:9443`,
          solution: 'Always set a custom User-Agent header and retry with exponential backoff.',
        }),
      });
    }

    async function runEvals() {
      spawnPacket('coordinator', 'airlock', '#10b981', 'EVALS');
      await fetch('/api/evals', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
    }

    document.getElementById('promptInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') launchMission(false);
    });

    refreshState();
  </script>
</body>
